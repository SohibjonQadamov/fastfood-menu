<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fast Food</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f5f5f5;
            --white: #fff;
            --black: #1a1a1a;
            --yellow: #fce000;
            --red: #ff3b30;
            --green: #34c759;
            --gray: #8e8e93;
            --card-shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--black);
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER */
        .header {
            background: var(--yellow);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .header-icons {
            display: flex;
            gap: 16px;
            font-size: 22px;
        }

        /* LOCATION BAR */
        .location-bar {
            background: var(--white);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--gray);
            border-bottom: 1px solid #eee;
        }

        /* STORES ROW - Gorizontal scroll */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            padding: 20px 16px 10px;
        }
        .stores-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 0 16px 20px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .stores-scroll::-webkit-scrollbar { display: none; }
        
        .store-card {
            min-width: 130px;
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px 14px;
            text-align: center;
            box-shadow: var(--card-shadow);
            scroll-snap-align: start;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .store-card:active { transform: scale(0.95); }
        .store-avatar {
            width: 56px;
            height: 56px;
            background: #f0f0f0;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        .store-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .store-time {
            font-size: 11px;
            color: var(--gray);
        }
        .store-rating {
            font-size: 11px;
            color: var(--green);
            margin-top: 2px;
        }

        /* DISCOUNT / SKIDKA */
        .discount-section {
            padding: 0 16px 20px;
        }
        .discount-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .discount-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .discount-card:active { transform: scale(0.97); }
        .discount-img {
            width: 100%;
            height: 100px;
            background: linear-gradient(135deg, #ff6b6b, #ff3b30);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .discount-info {
            padding: 10px 12px;
        }
        .discount-name {
            font-size: 13px;
            font-weight: 600;
        }
        .discount-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--red);
            margin-top: 4px;
        }
        .discount-old {
            font-size: 11px;
            color: var(--gray);
            text-decoration: line-through;
            margin-left: 6px;
        }
        .discount-badge {
            background: var(--red);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 4px;
        }

        /* PRODUCTS - Do'kon ichida */
        .store-menu {
            padding: 0 16px;
        }
        .category-title {
            font-size: 16px;
            font-weight: 700;
            margin: 16px 0 10px;
            color: #333;
        }
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .product-item {
            background: var(--white);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .product-emoji {
            width: 50px;
            height: 50px;
            background: #f8f8f8;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .product-detail { flex: 1; }
        .product-name { font-size: 14px; font-weight: 600; }
        .product-desc { font-size: 11px; color: var(--gray); margin-top: 2px; }
        .product-price { font-size: 15px; font-weight: 700; margin-top: 4px; }
        .product-add {
            width: 36px; height: 36px;
            background: var(--yellow);
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 20px;
            border-top: 1px solid #eee;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 10px;
            color: var(--gray);
            cursor: pointer;
            border: none;
            background: none;
        }
        .nav-item.active { color: var(--black); }
        .nav-icon { font-size: 22px; }
        .cart-badge {
            position: absolute;
            top: -4px;
            right: 8px;
            background: var(--red);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* BACK BUTTON */
        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 0 8px;
        }

        /* HIDDEN */
        .hidden { display: none !important; }
        .page { display: none; }
        .page.active { display: block; }

        /* SAVAT MODAL */
        .cart-overlay {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--white);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            z-index: 200;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            max-height: 60vh;
            overflow-y: auto;
        }
        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .order-submit {
            width: 100%;
            padding: 16px;
            background: var(--yellow);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <div class="header" id="mainHeader">
        <div class="header-logo">🍔 Fast Food</div>
        <div class="header-icons">
            <span>🔍</span>
            <span onclick="showPage('profile')">👤</span>
        </div>
    </div>

    <!-- Store ichidagi header -->
    <div class="header hidden" id="storeHeader" style="background:white;">
        <button class="back-btn" onclick="showPage('home')">←</button>
        <div style="font-weight:700;font-size:16px;" id="storeTitle"></div>
        <div style="width:30px;"></div>
    </div>

    <!-- Location -->
    <div class="location-bar">📍 Toshkent, Chilonzor tumani</div>

    <!-- ===== PAGES ===== -->
    <div class="page active" id="page-home">
        <div class="section-title">🏪 Restoranlar</div>
        <div class="stores-scroll" id="storesList"></div>

        <div class="discount-section">
            <div class="section-title" style="padding-top:0;">🔥 Chegirmalar</div>
            <div class="discount-grid" id="discountList"></div>
        </div>
    </div>

    <div class="page" id="page-store">
        <div class="store-menu" id="storeMenu"></div>
    </div>

    <div class="page" id="page-profile">
        <div style="padding:20px;text-align:center;">
            <div style="font-size:60px;">👤</div>
            <h3 id="profileName">Foydalanuvchi</h3>
            <p style="color:var(--gray);">Buyurtmalar tarixi</p>
            <div id="orderHistory" style="text-align:left;margin-top:20px;"></div>
        </div>
    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" onclick="showPage('home')">
            <span class="nav-icon">🏠</span> Bosh
        </button>
        <button class="nav-item" onclick="showPage('home')">
            <span class="nav-icon">🔍</span> Qidirish
        </button>
        <button class="nav-item" onclick="toggleCart()" style="position:relative;">
            <span class="nav-icon">🛒</span> Savat
            <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
        </button>
        <button class="nav-item" onclick="showPage('profile')">
            <span class="nav-icon">👤</span> Profil
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let currentPage = 'home';
        let currentStore = null;
        let cart = [];

        // DEFAULT DATA
        const stores = [
            { id: 1, name: "Lavash House", emoji: "🥙", time: "15-20 min", rating: "4.8", address: "Chilonzor" },
            { id: 2, name: "Burger King", emoji: "🍔", time: "20-25 min", rating: "4.6", address: "Mirzo Ulug'bek" },
            { id: 3, name: "Pizza Time", emoji: "🍕", time: "25-30 min", rating: "4.9", address: "Yunusobod" },
            { id: 4, name: "Sushi Wok", emoji: "🍣", time: "30-35 min", rating: "4.7", address: "Shayxontohur" },
        ];

        const allProducts = {
            1: [
                { id: 1, name: "Lavash mol go'sht", price: 28000, emoji: "🥙", category: "Lavash" },
                { id: 2, name: "Lavash tovuqli", price: 25000, emoji: "🌯", category: "Lavash" },
                { id: 3, name: "Cola 0.5L", price: 8000, emoji: "🥤", category: "Ichimliklar" },
            ],
            2: [
                { id: 4, name: "Gamburger", price: 22000, emoji: "🍔", category: "Burger" },
                { id: 5, name: "Chizburger", price: 25000, emoji: "🍔", category: "Burger" },
            ],
            3: [
                { id: 6, name: "Pepperoni", price: 45000, emoji: "🍕", category: "Pitsa" },
                { id: 7, name: "Margarita", price: 38000, emoji: "🍕", category: "Pitsa" },
            ],
            4: [
                { id: 8, name: "Filadelfiya", price: 55000, emoji: "🍣", category: "Sushi" },
                { id: 9, name: "Kaliforniya", price: 48000, emoji: "🍣", category: "Sushi" },
            ],
        };

        const discounts = [
            { name: "Lavash mol go'sht", oldPrice: 32000, price: 25000, emoji: "🥙", badge: "-22%" },
            { name: "Gamburger", oldPrice: 28000, price: 19000, emoji: "🍔", badge: "-32%" },
            { name: "Pepsi 1L", oldPrice: 14000, price: 9000, emoji: "🥤", badge: "-36%" },
            { name: "Hot-Dog", oldPrice: 18000, price: 12000, emoji: "🌭", badge: "-33%" },
        ];

        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${page}`).classList.add('active');
            currentPage = page;

            // Header toggle
            if (page === 'home' || page === 'profile') {
                document.getElementById('mainHeader').classList.remove('hidden');
                document.getElementById('storeHeader').classList.add('hidden');
            }

            // Nav active
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if (page === 'home') document.querySelectorAll('.nav-item')[0].classList.add('active');
            if (page === 'profile') document.querySelectorAll('.nav-item')[3].classList.add('active');

            if (page === 'profile') renderProfile();
        }

        function openStore(storeId) {
            currentStore = stores.find(s => s.id === storeId);
            document.getElementById('storeTitle').textContent = currentStore.emoji + ' ' + currentStore.name;
            document.getElementById('mainHeader').classList.add('hidden');
            document.getElementById('storeHeader').classList.remove('hidden');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-store').classList.add('active');
            currentPage = 'store';
            renderStoreMenu(storeId);
        }

        function renderStores() {
            document.getElementById('storesList').innerHTML = stores.map(s => `
                <div class="store-card" onclick="openStore(${s.id})">
                    <div class="store-avatar">${s.emoji}</div>
                    <div class="store-name">${s.name}</div>
                    <div class="store-time">🕐 ${s.time}</div>
                    <div class="store-rating">⭐ ${s.rating}</div>
                </div>
            `).join('');
        }

        function renderDiscounts() {
            document.getElementById('discountList').innerHTML = discounts.map(d => `
                <div class="discount-card">
                    <div class="discount-img">${d.emoji}</div>
                    <div class="discount-info">
                        <div class="discount-name">${d.name}</div>
                        <div class="discount-price">
                            ${d.price.toLocaleString()} so'm
                            <span class="discount-old">${d.oldPrice.toLocaleString()}</span>
                        </div>
                        <span class="discount-badge">${d.badge}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderStoreMenu(storeId) {
            const products = allProducts[storeId] || [];
            const categories = {};
            products.forEach(p => {
                if (!categories[p.category]) categories[p.category] = [];
                categories[p.category].push(p);
            });

            let html = '';
            for (const [cat, items] of Object.entries(categories)) {
                html += `<div class="category-title">${cat}</div><div class="product-list">`;
                items.forEach(p => {
                    html += `
                        <div class="product-item">
                            <div class="product-emoji">${p.emoji}</div>
                            <div class="product-detail">
                                <div class="product-name">${p.name}</div>
                                <div class="product-price">${p.price.toLocaleString()} so'm</div>
                            </div>
                            <button class="product-add" onclick="addToCart(${p.id}, ${storeId})">+</button>
                        </div>`;
                });
                html += '</div>';
            }
            document.getElementById('storeMenu').innerHTML = html;
        }

        function addToCart(productId, storeId) {
            const product = allProducts[storeId]?.find(p => p.id === productId);
            if (!product) return;
            const existing = cart.find(i => i.id === productId);
            if (existing) existing.qty += 1;
            else cart.push({ ...product, qty: 1, storeId });
            updateCartBadge();
        }

        function updateCartBadge() {
            const count = cart.reduce((s, i) => s + i.qty, 0);
            const badge = document.getElementById('cartBadge');
            badge.textContent = count;
            badge.style.display = count > 0 ? 'block' : 'none';
        }

        function toggleCart() {
            if (cart.length === 0) { tg.showAlert("Savat bo'sh!"); return; }
            const overlay = document.createElement('div');
            overlay.className = 'cart-overlay';
            overlay.id = 'cartOverlay';
            const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
            overlay.innerHTML = `
                <div style="display:flex;justify-content:space-between;margin-bottom:16px;">
                    <strong>🛒 Savat</strong>
                    <span onclick="document.getElementById('cartOverlay').remove()" style="cursor:pointer;">✕</span>
                </div>
                ${cart.map(i => `
                    <div class="cart-item-row">
                        <span>${i.emoji} ${i.name} x${i.qty}</span>
                        <strong>${(i.price * i.qty).toLocaleString()} so'm</strong>
                    </div>
                `).join('')}
                <div style="font-weight:700;font-size:18px;margin-top:12px;">Jami: ${total.toLocaleString()} so'm</div>
                <button class="order-submit" onclick="submitOrder()">📝 Buyurtma berish</button>
            `;
            document.body.appendChild(overlay);
        }

        function submitOrder() {
            const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
            const items = cart.map(i => `${i.name} x${i.qty}`).join(', ');
            tg.sendData(JSON.stringify({ action: "order", items, total }));
            cart = [];
            updateCartBadge();
            const ov = document.getElementById('cartOverlay');
            if (ov) ov.remove();
            tg.close();
        }

        function renderProfile() {
            const user = tg.initDataUnsafe?.user;
            document.getElementById('profileName').textContent = user?.first_name || 'Foydalanuvchi';
            document.getElementById('orderHistory').innerHTML = '<p style="color:var(--gray);">Hozircha buyurtmalar yo\'q</p>';
        }

        // INIT
        renderStores();
        renderDiscounts();
        updateCartBadge();
    </script>
</body>
</html>
